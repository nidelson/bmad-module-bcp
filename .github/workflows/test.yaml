name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Run full suite
        # testpaths = ["tests"] in pyproject.toml. The scoring engine and its
        # co-located unit tests moved to bmad-module-pulse; what runs here are
        # the invariants that keep this deprecated module safe to install
        # alongside it.
        run: uv run --group test pytest -v

      - name: Verify root module.yaml mirrors the setup asset
        run: |
          diff -q module.yaml \
            skills/bmad-bcp-setup/assets/module.yaml

  install-e2e:
    # Real `npx bmad-method install` against this tree. Separate job so the
    # network/npx cost never slows the deterministic suite above. This is
    # the executable form of the v0.1.0 module validation (VM).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Real installer e2e
        env:
          BCP_E2E_INSTALL: "1"
        run: uv run --group test pytest -v -m integration -k install
