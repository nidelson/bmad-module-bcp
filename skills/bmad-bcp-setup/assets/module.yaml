code: bcp
name: BCP — Business Complexity Points Scorer (DEPRECATED)
header: 'BCP: Business Complexity Points Scorer (DEPRECATED)'
subheader: >-
  DEPRECATED — BCP scoring moved to bmad-module-pulse. This module now ships
  only the migration path.
description: >-
  DEPRECATED. The scoring skills, the BCP ruler and the per-category baseline
  now live in bmad-module-pulse, which owns the whole estimate-to-measurement
  loop. Nothing about the data format changed — the skills moved, the baseline
  and the bcp.* frontmatter did not. Install PULSE, answer "bcp" to its
  estimation-method prompt, then run /bmad-bcp-setup here to move the bcp_*
  configuration and uninstall this module.
module_version: 0.1.12
default_selected: false
module_greeting: >
  Este módulo foi descontinuado. O scoring BCP agora vive no PULSE
  (https://github.com/nidelson/bmad-module-pulse), que passou a ser dono do
  ciclo inteiro: pontua, deriva estimated_hours, mede a implementação e
  recalibra o baseline com as horas reais.

  Nada mudou de formato. Rode /bmad-bcp-setup para migrar a configuração e o
  baseline, e depois desinstale este módulo.
bcp_overwrite_estimated_hours:
  prompt: >-
    BCP pode sobrescrever o estimated_hours definido pela Amelia? Instalar o
    módulo é o consentimento — a auditoria original é preservada em
    estimated_hours_pre_bcp.
  default: 'yes'
  result: '{value}'
  single-select:
    - value: 'yes'
      label: Sim — BCP é a fonte de verdade da estimativa (Recomendado)
    - value: 'no'
      label: Não — BCP apenas anexa o bloco bcp.* sem mexer em estimated_hours
bcp_non_interactive_default:
  prompt: >-
    Rodar o scoring em modo não-interativo por padrão (acima do threshold de
    confiança)?
  default: 'yes'
  result: '{value}'
  single-select:
    - value: 'yes'
      label: Sim — auto-score direto, dry-run só em divergência (Recomendado)
    - value: 'no'
      label: Não — sempre abrir dry-run review
bcp_confidence_threshold:
  prompt: Acima de qual confiança (0–1) o scoring pula o dry-run review?
  default: '0.75'
  result: '{value}'
  single-select:
    - value: '0.6'
      label: 0.6 — permissivo
    - value: '0.75'
      label: 0.75 — equilibrado (Recomendado)
    - value: '0.9'
      label: 0.9 — conservador (revisa mais)
bcp_estimation_basis:
  prompt: Rótulo gravado em estimated_hours_basis quando o BCP estima?
  default: bcp
  result: '{value}'
bcp_baseline_seed:
  prompt: >-
    Seed de horas por BCP para cold start (valor de partida; a CI&T nao publica
    fator de conversao)?
  default: '5.0'
  result: '{value}'
bcp_baseline_min_samples:
  prompt: Amostras mínimas antes de uma categoria sair do seed?
  default: '5'
  result: '{value}'
bcp_baseline_rolling_window:
  prompt: Tamanho da janela FIFO de recalibração do baseline?
  default: '10'
  result: '{value}'
bcp_reference_h_per_bcp:
  prompt: >-
    Reference rate frozen (h/BCP) para a âncora de alavancagem — a taxa de
    cotação/benchmark do time, distinta do seed e do fator recalibrado. Gera
    estimated_hours_reference (denominador estável que não colapsa). Muda só por
    governança, nunca recalibra. Default = seed.
  default: '5.0'
  result: '{value}'
bcp_data_folder:
  prompt: Pasta onde o baseline e artefatos BCP ficam armazenados?
  default: '{output_folder}/implementation-artifacts'
  result: '{value}'
bcp_baseline_path:
  prompt: Caminho do arquivo de baseline por categoria?
  default: '{output_folder}/implementation-artifacts/bcp-baseline.yaml'
  result: '{value}'
directories:
  - '{bcp_data_folder}'
